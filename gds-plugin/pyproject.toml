[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fprime-gds-space-packet"
version = "0.1.0"
description = "F Prime GDS framing plugin: CCSDS Space Packets carried inside F Prime frames"
dependencies = [
    "pluggy>=1.3.0",
    "fprime-gds",
]

# Registers the framer with fprime-gds' plugin system. The key is just a pluggy
# label; the CLI name (space-packet-fprime) comes from the class's get_name().
[project.entry-points.fprime_gds]
space_packet_fprime = "gds_space_packet_fprime:SpacePacketFprimeFramerDeframer"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["gds_space_packet_fprime"]
