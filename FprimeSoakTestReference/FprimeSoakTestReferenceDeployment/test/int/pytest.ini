[pytest]
# Pytest's IntegrationTestAPI uses its own FileUplinker (default chunk 256).
# That is independent of fprime-gds.yml / --file-uplink-chunk-size on the GDS
# process. 256 B DATA + F´ file headers exceeds the RFM69 255 B MTU, so FSW
# sees START (seq 0) then END (seq 5) with DATA dropped.
addopts = --file-uplink-chunk-size 100 --file-uplink-cooldown 1.00 --tts-port 52051 --tts-addr 127.0.0.1
