command-line-options:
  no-app:
  dictionary: ../../build-artifacts/aarch64-linux/FprimeSoakTestReference_FprimeSoakTestReferenceDeployment/dict/FprimeSoakTestReferenceDeploymentTopologyDictionary.json
  communication-selection: uart
  uart-device: /dev/rfm69-feather
  uart-baud: 115200
  # Must match pytest --tts-port (and test/int/pytest.ini). Harmless when ZMQ is
  # on (the default); required if you pass --no-zmq.
  tts-port: 52051
  tts-addr: 127.0.0.1
  gui-port: 5011
  # Provided by the fprime-gds-space-packet plugin at ../../../gds-plugin.
  # `pip install <repo>/gds-plugin` into the GDS venv auto-registers this
  # framer (setuptools fprime_gds entry point) -- no PYTHONPATH or
  # FPRIME_GDS_EXTRA_PLUGINS needed. raw-space-packet drops OpCode EVRs.
  framing-selection: space-packet-fprime
  file-uplink-chunk-size: 100
  file-uplink-cooldown: 1.00
